
<style>
.dw { max-width: 460px; margin: 1.5rem auto; font-family: var(--font-sans); }
.dw-head { background: #1a1a2e; border-radius: 16px 16px 0 0; padding: 2rem 2rem 1.6rem; text-align: center; }
.dw-body { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-top: none; border-radius: 0 0 16px 16px; padding: 1.25rem; }
.dw-card { border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: 10px; display: flex; align-items: center; gap: 14px; border: 0.5px solid transparent; transition: border-color 0.15s; }
.dw-card:hover { border-color: rgba(255,255,255,0.15); }
.dw-card-vf { background: #16213e; }
.dw-card-ip { background: #0f3460; }
.dw-icon { width: 42px; height: 42px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.dw-num { font-size: 20px; font-weight: 500; letter-spacing: 0.06em; color: #fff; margin: 0; }
.dw-lbl { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.45); margin: 0 0 3px; }
.dw-btn { margin-left: auto; background: rgba(255,255,255,0.1); border: 0.5px solid rgba(255,255,255,0.2); border-radius: 8px; padding: 7px 14px; font-size: 12px; color: rgba(255,255,255,0.85); cursor: pointer; display: flex; align-items: center; gap: 6px; flex-shrink: 0; transition: background 0.15s; }
.dw-btn:hover { background: rgba(255,255,255,0.18); }
.dw-btn:active { transform: scale(0.97); }
.dw-divider { display: flex; align-items: center; gap: 10px; margin: 1rem 0; }
.dw-divider span { font-size: 11px; color: var(--color-text-tertiary); letter-spacing: 0.06em; white-space: nowrap; }
.dw-divider hr { flex: 1; border: none; border-top: 0.5px solid var(--color-border-tertiary); }
.dw-footer { text-align: center; font-size: 12px; color: var(--color-text-tertiary); margin-top: 1rem; display: flex; align-items: center; justify-content: center; gap: 6px; }
.pulse { width: 64px; height: 64px; border-radius: 50%; background: rgba(127,119,221,0.15); border: 1.5px solid rgba(127,119,221,0.4); display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; animation: pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.08);opacity:0.75} }
</style>

<div class="dw">
  <h2 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);">Donation window — VF Cash and InstaPay payment details</h2>

  <div class="dw-head">
    <div class="pulse">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#AFA9EC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
    </div>
    <p style="margin:0 0 5px; font-size:20px; font-weight:500; color:#fff;">Make a donation</p>
    <p style="margin:0; font-size:13px; color:rgba(255,255,255,0.4);">Your support means the world to us</p>
  </div>

  <div class="dw-body">
    <div class="dw-divider"><hr><span>choose your method</span><hr></div>

    <div class="dw-card dw-card-vf">
      <div class="dw-icon" style="background:rgba(95,74,183,0.35);">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#AFA9EC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
      </div>
      <div style="flex:1;min-width:0;">
        <p class="dw-lbl">VF Cash</p>
        <p class="dw-num">01093566524</p>
      </div>
      <button class="dw-btn" onclick="doCopy('01093566524',this)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        Copy
      </button>
    </div>

    <div class="dw-card dw-card-ip">
      <div class="dw-icon" style="background:rgba(29,158,117,0.28);">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5DCAA5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 16l-4-4 4-4"/><path d="M3 12h11"/><path d="M17 8l4 4-4 4"/><path d="M21 12H10"/></svg>
      </div>
      <div style="flex:1;min-width:0;">
        <p class="dw-lbl">InstaPay</p>
        <p class="dw-num">01110417490</p>
      </div>
      <button class="dw-btn" onclick="doCopy('01110417490',this)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        Copy
      </button>
    </div>

    <div class="dw-footer">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-success)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      Safe &amp; secure · Copy the number and open your app
    </div>
  </div>
</div>

<script>
function doCopy(num, btn) {
  navigator.clipboard.writeText(num).then(() => {
    const orig = btn.innerHTML;
    btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Copied!';
    btn.style.background = 'rgba(93,202,165,0.25)';
    btn.style.borderColor = 'rgba(93,202,165,0.5)';
    btn.style.color = '#5DCAA5';
    setTimeout(() => {
      btn.innerHTML = orig;
      btn.style.background = '';
      btn.style.borderColor = '';
      btn.style.color = '';
    }, 2000);
  });
}
</script>
